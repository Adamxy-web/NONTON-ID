
name: Build NONTON ID APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip NONTON_ID_Android_Source.zip

      - name: Build APK
        run: gradle -p NONTON_ID_Android :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NONTON-ID-APK
          path: NONTON_ID_Android/app/build/outputs/apk/debug/app-debug.apk
